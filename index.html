<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобиком Корпораци</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-zinc-100">
    <div class="flex justify-center">
        <div class="w-[95%] h-[75px] bg-[#2a2a2a] rounded-xl mt-6 flex">
            <div class="w-[20%] flex justify-center items-center">
                <img src="./mobicom-logo-hq.png" class="w-16 h-9 mr-6" alt="">
                <form class="flex bg-[#3d3d3d] border border-[#2a2a2a] text-white rounded-2xl shadow text-sm h-10 w-55">
                <div aria-disabled="true" class="w-10 grid place-content-center">
                    <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    >
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                    </svg>
                </div>
                <input
                    type="text"
                    spellcheck="false"
                    name="text"
                    class="bg-transparent py-1.5 outline-none placeholder:text-zinc-400 font-medium text-base w-20 focus:w-48 transition-all"
                    placeholder="Search"
                />
                </form>
            </div>
            <div class="w-[65%] text-sm flex justify-center items-center">
                <button class="w-25 h-10 rounded-xl bg-[#2a2a2a] text-white font-bold hover:bg-neutral-700">Service</button>
                <button class="w-17 h-10 rounded-xl bg-[#2a2a2a] text-white font-bold hover:bg-neutral-700">News</button>
                <button class="w-25 h-10 rounded-xl bg-[#2a2a2a] text-white font-bold hover:bg-neutral-700">Online Shop</button>
                <button class="w-15 h-10 rounded-xl bg-[#2a2a2a] text-white font-bold hover:bg-neutral-700">5G</button>
            </div>
            <div class="w-[15%] flex justify-end items-center justify-between">
                <button class="w-10 h-10 rounded-xl bg-neutral-700 text-white font-bold hover:bg-neutral-600 mr-3"><i class="fa fa-sun-o" aria-hidden="true"></i></button>
                <button class="w-10 h-10 rounded-xl bg-neutral-700 text-white font-bold hover:bg-neutral-600 mr-3"><i class="fa fa-sliders" aria-hidden="true"></i></button>
                <button class="w-10 h-10 rounded-xl bg-neutral-700 text-white font-bold hover:bg-neutral-600 mr-5"><i class="fa fa-shopping-basket" aria-hidden="true"></i></button>
            </div>
        </div>
    </div>
    <div class="flex justify-center items-center">
        <div class="w-[95%] h-[820px] mt-6 rounded-xl overflow-hidden relative"> 
            <img class="absolute inset-0 w-full h-full object-cover z-0" src="https://blob.blob.ub.cloud.mobinet.mn/blob/content/mcommerce/uploads/DJI_20231028181037_0240_D_MAX_Recovered_ezgif_com_jpg_to_webp_converter_d02db53f44.webp" alt="">
            
            <div class="absolute inset-0 z-10"></div>
            <div class="absolute right-270 top-75 z-20 w-[600px] h-[32%] rounded-2xl shadow-2xl ">
                <p class="text-5xl font-bold text-white">Simple through smart</p>
            </div>

            <div class="absolute right-40 top-30 z-20 w-[510px] h-[62%] rounded-2xl shadow-2xl backdrop-blur-md p-4">
                <div class="w-120 h-13 bg-white flex justify-center items-center rounded-lg shadow-md">
                    <div class="flex items-center gap-3">
                        <button class="w-55 h-9 rounded-xl bg-[#222222] text-white font-semibold text-sm">Quick action</button>
                        <button class="w-55 h-9 rounded-xl text-gray-600 font-medium text-sm">Internet action</button>
                    </div>
                </div>
                <div class="w-120 h-103 mt-4 bg-white flex justify-center items-center rounded-lg shadow-md grid grid-cols-2 gap-y-6 gap-x-8 place-items-center">

                    <div class="relative flex flex-col items-center justify-center p-3">
                        <div class="w-15 h-15 bg-white rounded-full flex items-center justify-center shadow-md border-2 border-red-400 ring-3 ring-red-100">
                            <img src="./phone.svg" alt="">
                        </div>
                        <span class="mt-2 text-sm font-medium text-gray-700">Buy unit</span>
                    </div>

                    <div class="flex flex-col items-center justify-center p-3">
                        <div class="w-15 h-15 bg-white rounded-full flex items-center justify-center shadow-md border-2 border-red-300 ring-1 ring-red-100">
                            <img src="./Data.svg" alt="">
                        </div>
                        <span class="mt-2 text-sm font-medium text-gray-700">Buy data</span>
                    </div>

                    <div class="flex flex-col items-center justify-center p-3">
                        <div class="w-15 h-15 bg-white rounded-full flex items-center justify-center shadow-md border-2 border-red-400 ring-2 ring-red-100">
                            <img src="./simRecover.svg" alt="">
                        </div>
                        <span class="mt-2 text-sm font-medium text-gray-700">Sim recovery</span>
                    </div>

                    <div class="flex flex-col items-center justify-center p-3">
                        <div class="w-15 h-15 bg-white rounded-full flex items-center justify-center shadow-md border-2 border-red-400 ring-2 ring-red-100">
                            <img src="./wallet-plus.svg" alt="">
                        </div>
                        <span class="mt-2 text-sm font-medium text-gray-700">Pay bill</span>
                    </div>

                    <div class="flex flex-col items-center justify-center p-3">
                        <div class="w-15 h-15 bg-white rounded-full flex items-center justify-center shadow-md border-2 border-red-400 ring-2 ring-red-100">
                            <img src="./handset-dti.svg" alt="">
                        </div>
                        <span class="mt-2 text-sm font-medium text-gray-700 text-center">Loan Assesment</span>
                    </div>

                    <div class="flex flex-col items-center justify-center p-3">
                        <div class="w-15 h-15 bg-white rounded-full flex items-center justify-center shadow-md border-2 border-red-400 ring-2 ring-red-100">
                            <img src="./simRecover.svg" alt="">
                        </div>
                        <span class="mt-2 text-sm font-medium text-gray-700">New number</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
